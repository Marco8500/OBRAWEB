[build]
  # La web no necesita compilarse; este comando sustituye al del panel de Netlify.
  command = "echo 'Web estatica: sin paso de build'"
  publish = "."
  functions = "netlify/functions"

# El área del equipo no debe aparecer en Google
[[headers]]
  for = "/equipo.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# El área de clientes tampoco
[[headers]]
  for = "/clientes.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
