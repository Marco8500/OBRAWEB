<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página no encontrada · Flor &amp; Atelier</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2D4B3E">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
    .page { text-align: center; max-width: 560px; }
    .page img.mark { width: 34px; margin: 0 auto 28px; }
    .page .h2 { font-size: clamp(34px, 6vw, 52px); }
    .page p.lead { margin-top: 16px; color: var(--ink-2); font-size: 17px; }
    .page .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 32px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3.5 20.5 4.8 16A8.5 8.5 0 1 1 8 19.3Z"/><path d="M9 8.6c.2-.5.6-.6 1-.6l.9 2-.8 1a5 5 0 0 0 2.9 2.9l1-.8 2 .9c0 .4-.1.8-.6 1-1.6.9-4.2-.3-5.8-2s-2.9-4-2-5.6"/></symbol>
  </defs></svg>
  <main class="container page">
    <img class="mark" src="/assets/img/logo-mark.png" alt="Flor &amp; Atelier" width="34" height="47">
    <p class="eyebrow">Error 404</p>
    <h1 class="h2">Esta flor <em>no está aquí</em></h1>
    <p class="lead">La página que buscas no existe o se ha movido. Vuelve al inicio para ver nuestros ramos o escríbenos y te ayudamos.</p>
    <div class="actions">
      <a class="btn btn--primary btn--lg" href="/">Volver al inicio <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      <!-- Mismo número que CONFIG.whatsapp en assets/js/main.js -->
      <a class="btn btn--wa btn--lg" href="https://wa.me/34600000000" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-wa"/></svg>Escribir por WhatsApp</a>
    </div>
  </main>
</body>
</html>
